<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FlorentinoPc</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#e8eaed;
  --surface:#f2f3f5;
  --card:#ffffff;
  --card2:#f0f1f3;
  --border:#d1d5db;
  --border2:#e5e7eb;
  --gold:#c97c10;
  --goldb:#fff3dc;
  --green:#0a6640;
  --greenb:#e6f7ee;
  --red:#b91c1c;
  --redb:#fde8e8;
  --blue:#1549a0;
  --blueb:#e8f0fc;
  --warn:#92400e;
  --warnb:#fef3c7;
  --text:#111827;
  --text2:#374151;
  --muted:#6b7280;
  --font:'Inter',sans-serif;
  --radius:10px;
  --shadow:0 1px 4px rgba(0,0,0,.08);
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;}

/* LAYOUT PC */
.app{display:flex;flex-direction:column;min-height:100vh;}

/* HEADER */
.header{background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;box-shadow:var(--shadow);position:sticky;top:0;z-index:100;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-logo{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);}
.brand-name{font-size:15px;font-weight:800;color:var(--text);}
.brand-sub{font-size:10px;color:var(--muted);}
.header-nav{display:flex;align-items:center;gap:2px;}
.hnav{padding:6px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;font-family:var(--font);display:flex;align-items:center;gap:6px;transition:all .15s;}
.hnav:hover{background:var(--card2);color:var(--text);}
.hnav.active{background:var(--goldb);color:var(--gold);}
.hnav svg{width:15px;height:15px;flex-shrink:0;}
.header-right{display:flex;align-items:center;gap:8px;}
.alerta{background:var(--warnb);color:var(--warn);border:1px solid #fde68a;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;display:none;white-space:nowrap;}

/* MAIN */
.main{flex:1;padding:20px;max-width:1100px;margin:0 auto;width:100%;}

/* PANELS */
.panel{display:none;}
.panel.active{display:block;}

/* GRID DE STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);padding:14px 16px;border-left:4px solid var(--gold);box-shadow:var(--shadow);}
.stat.green{border-left-color:var(--green);}
.stat.blue{border-left-color:var(--blue);}
.stat.warn{border-left-color:var(--warn);}
.stat.red{border-left-color:var(--red);}
.stat-val{font-size:22px;font-weight:800;line-height:1;}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:500;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);}
.card-hdr{padding:10px 16px;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center;background:var(--card2);}
.card-title{font-size:13px;font-weight:700;color:var(--text2);}

/* GRID 2 COL para PC */
.grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* ITEMS */
.item{padding:10px 16px;border-bottom:1px solid var(--border2);display:flex;gap:12px;align-items:center;cursor:pointer;transition:background .1s;}
.item:last-child{border-bottom:none;}
.item:hover{background:var(--card2);}
.item-main{flex:1;min-width:0;}
.item-id{font-size:10px;color:var(--muted);font-family:monospace;}
.item-titulo{font-weight:700;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-sub{font-size:12px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.item-monto{font-weight:800;color:var(--green);font-size:13px;}

/* BADGES */
.badge{display:inline-block;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;white-space:nowrap;}
.b-ing{background:var(--warnb);color:var(--warn);border:1px solid #fcd34d;}
.b-rep{background:var(--blueb);color:var(--blue);border:1px solid #93c5fd;}
.b-list{background:var(--greenb);color:var(--green);border:1px solid #6ee7b7;}
.b-ent{background:#f3f4f6;color:#6b7280;border:1px solid #d1d5db;}
.b-pag{background:var(--greenb);color:var(--green);border:1px solid #6ee7b7;}

/* STEPPER */
.stepper{display:flex;margin:14px 0;}
.step{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.step-wrap{width:100%;display:flex;align-items:center;}
.step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:2px solid var(--border);background:var(--card2);color:var(--muted);flex-shrink:0;transition:all .2s;}
.step-dot.done{background:var(--green);border-color:var(--green);color:#fff;}
.step-dot.cur{background:var(--gold);border-color:var(--gold);color:#fff;}
.step-line{flex:1;height:2px;background:var(--border);}
.step-line.done{background:var(--green);}
.step-txt{font-size:9px;color:var(--muted);margin-top:4px;text-align:center;font-weight:600;}
.step-txt.done{color:var(--green);}
.step-txt.cur{color:var(--gold);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:7px;padding:7px 14px;font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap;line-height:1;}
.btn:hover{filter:brightness(.94);}
.btn:active{filter:brightness(.88);}
.btn-gold{background:var(--gold);color:#fff;border-color:var(--gold);}
.btn-green{background:var(--green);color:#fff;border-color:var(--green);}
.btn-muted{background:var(--card2);color:var(--text2);border-color:var(--border);}
.btn-wa{background:#128c7e;color:#fff;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px;}

/* PERIODO TABS */
.ptabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.ptab{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--muted);background:var(--card);font-family:var(--font);transition:all .15s;}
.ptab.active{background:var(--gold);color:#fff;border-color:var(--gold);}

/* SEARCH BAR */
.search-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.search-input{flex:1;min-width:140px;background:var(--card);border:1.5px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:13px;padding:7px 12px;outline:none;}
.search-input:focus{border-color:var(--gold);}
.search-select{background:var(--card);border:1.5px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:13px;padding:7px 10px;outline:none;}
.search-select:focus{border-color:var(--gold);}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;align-items:center;justify-content:center;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:var(--card);border-radius:14px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.18);}
.modal-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border2);}
.modal-footer{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border2);}
.modal-footer .btn{flex:1;}

/* FORMS */
.field{margin-bottom:11px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.field input,.field select{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:14px;padding:8px 11px;outline:none;transition:border .15s;}
.field input:focus,.field select:focus{border-color:var(--gold);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sugs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.sug{background:var(--goldb);border:1px solid #fcd34d;border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;color:var(--gold);font-weight:600;}
.sug:hover{background:var(--gold);color:#fff;}

/* INFO BOX */
.info-box{background:var(--card2);border-radius:7px;padding:11px 13px;font-size:13px;line-height:1.8;margin-bottom:13px;border:1px solid var(--border2);color:var(--text2);}
.info-box b{color:var(--text);}

/* GANANCIA BOX */
.gan-box{background:var(--greenb);border:1px solid #6ee7b7;border-radius:7px;padding:11px 13px;margin-bottom:12px;}
.gan-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:3px;}

/* TICKET */
.ticket{background:#fff;color:#000;border-radius:8px;padding:16px;font-family:monospace;font-size:12px;line-height:1.8;border:1px solid var(--border);}
.ticket hr{border:none;border-top:1px dashed #ccc;margin:6px 0;}
.tc{text-align:center;}

/* ALERTA STRIP */
.alerta-strip{background:var(--warnb);border:1px solid #fcd34d;border-radius:7px;padding:9px 12px;font-size:13px;color:var(--warn);margin-bottom:12px;font-weight:500;}

/* CAJA DETAIL */
.caja-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:6px;padding:6px 0;border-bottom:1px solid var(--border2);}
.caja-row:last-child{border-bottom:none;}
.caja-row.total{font-weight:800;font-size:14px;color:var(--text);padding-top:10px;border-top:2px solid var(--border);}

/* BACKUP BAR */
.backup-bar{background:var(--card);border-top:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;justify-content:flex-end;gap:8px;}

/* EMPTY */
.empty{text-align:center;color:var(--muted);padding:28px;font-size:13px;}

/* MOBILE */
.mobile-tabs{display:none;}

@media(max-width:680px){
  .header-nav{display:none;}
  .mobile-tabs{display:flex;background:var(--card);border-top:1px solid var(--border);position:fixed;bottom:0;left:0;right:0;z-index:100;}
  .mtab{flex:1;padding:8px 4px 6px;text-align:center;font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;border-top:2px solid transparent;transition:all .15s;}
  .mtab.active{color:var(--gold);border-top-color:var(--gold);}
  .mtab svg{display:block;margin:0 auto 3px;width:18px;height:18px;}
  .main{padding:12px;padding-bottom:70px;}
  .stats{grid-template-columns:repeat(2,1fr);gap:8px;}
  .grid-2col{grid-template-columns:1fr;}
  .modal-bg{align-items:flex-end;padding:0;}
  .modal{border-radius:16px 16px 0 0;max-height:88vh;}
  .backup-bar{padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));}
  .header{padding:0 12px;}
}
</style>
</head>

<script>
var NEG = {nombre:'FlorentinoPc',tel:'3388439333',email:'luismariarios@gmail.com',dir:'Calle 30 N 162',cuit:'23-22894106-9'};
var ESTADOS = ['Ingresado','En reparacion','Listo','Entregado'];
var BC = {Ingresado:'b-ing','En reparacion':'b-rep',Listo:'b-list',Entregado:'b-ent'};
var EC = {Ingresado:'#92400e','En reparacion':'#1549a0',Listo:'#0a6640',Entregado:'#6b7280'};

function uid(){return Math.random().toString(36).slice(2,8).toUpperCase();}
function hoy(){return new Date().toLocaleDateString('es-AR');}
function aho(){return new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});}
function din(n){return '$'+Number(n||0).toLocaleString('es-AR');}
function bdg(e){return '<span class="badge '+(BC[e]||'b-ent')+'">'+e+'</span>';}

var ords = JSON.parse(localStorage.getItem('fpc_ord')||'[]');
var vens = JSON.parse(localStorage.getItem('fpc_ven')||'[]');

if(ords.length===0){
  ords=[
    {id:'OR-'+uid(),fecha:hoy(),hora:'09:30',cli:'Maria Gonzalez',tel:'1155443322',eq:'Notebook HP',serie:'SN123456',prob:'No enciende',est:'En reparacion',precio:8500,clave:'1234',obs:'',pagado:false,medio:''},
    {id:'OR-'+uid(),fecha:hoy(),hora:'11:00',cli:'Carlos Perez',tel:'1166778899',eq:'iPhone 12',serie:'IMEI987654',prob:'Pantalla rota',est:'Listo',precio:15000,clave:'',obs:'',pagado:false,medio:''}
  ];
  vens=[
    {id:'V-'+uid(),fecha:hoy(),hora:'10:00',desc:'Cable USB tipo C',costo:1500,venta:3000,cat:'Producto',medio:'Efectivo'},
    {id:'V-'+uid(),fecha:hoy(),hora:'12:00',desc:'Limpieza notebook',costo:0,venta:2500,cat:'Servicio',medio:'Transferencia'}
  ];
  save();
}

function save(){
  localStorage.setItem('fpc_ord',JSON.stringify(ords));
  localStorage.setItem('fpc_ven',JSON.stringify(vens));
}

function ir(panel, hnId, mtId){
  var ps=document.querySelectorAll('.panel');
  for(var i=0;i<ps.length;i++) ps[i].classList.remove('active');
  var hns=document.querySelectorAll('.hnav');
  for(var i=0;i<hns.length;i++) hns[i].classList.remove('active');
  var mts=document.querySelectorAll('.mtab');
  for(var i=0;i<mts.length;i++) mts[i].classList.remove('active');
  document.getElementById('panel-'+panel).classList.add('active');
  var hn=document.getElementById(hnId);
  if(hn) hn.classList.add('active');
  var mt=document.getElementById(mtId);
  if(mt) mt.classList.add('active');
  if(panel==='dash') rDash();
  else if(panel==='ordenes') rOrd();
  else if(panel==='ventas') rVen();
  else if(panel==='caja') rCaja();
}

function alerta(){
  var n=0;
  for(var i=0;i<ords.length;i++) if(ords[i].est==='Listo') n++;
  var el=document.getElementById('alerta-listo');
  if(n>0){el.style.display='';el.textContent='! '+n+' listo'+(n>1?'s':'')+' sin retirar';}
  else el.style.display='none';
}

function rDash(){
  alerta();
  var h=hoy();
  var activas=0, listos=[];
  for(var i=0;i<ords.length;i++){
    if(ords[i].est!=='Entregado') activas++;
    if(ords[i].est==='Listo') listos.push(ords[i]);
  }
  var ganH=0,venH=0;
  for(var i=0;i<vens.length;i++){
    if(vens[i].fecha===h){ganH+=vens[i].venta-vens[i].costo;venH+=vens[i].venta;}
  }
  document.getElementById('dash-stats').innerHTML=
    '<div class="stat"><div class="stat-val">'+activas+'</div><div class="stat-lbl">Ordenes activas</div></div>'+
    '<div class="stat warn"><div class="stat-val" style="color:var(--warn);">'+listos.length+'</div><div class="stat-lbl">Listos sin retirar</div></div>'+
    '<div class="stat green"><div class="stat-val" style="color:var(--green);">'+din(venH)+'</div><div class="stat-lbl">Ventas hoy</div></div>'+
    '<div class="stat blue"><div class="stat-val" style="color:var(--blue);">'+din(ganH)+'</div><div class="stat-lbl">Ganancia hoy</div></div>';

  var h1='';
  var c=Math.min(ords.length,4);
  for(var i=0;i<c;i++){
    var o=ords[i];
    h1+='<div class="item" onclick="abrirDet(''+o.id+'')">'+
      '<div class="item-main"><div class="item-id">'+o.id+'</div><div class="item-titulo">'+o.cli+'</div><div class="item-sub">'+o.eq+'</div></div>'+
      '<div class="item-side">'+bdg(o.est)+(o.precio>0?'<div class="item-monto">'+din(o.precio)+'</div>':'')+'</div>'+
    '</div>';
  }
  document.getElementById('dash-ords').innerHTML=h1||'<div class="empty">Sin ordenes</div>';

  var h2='';
  for(var i=0;i<listos.length;i++){
    var o=listos[i];
    h2+='<div class="item">'+
      '<div class="item-main"><div class="item-titulo">'+o.cli+'</div><div class="item-sub">'+o.eq+' -- '+o.fecha+'</div></div>'+
      '<div class="item-side"><button class="btn btn-wa btn-sm" onclick="waRap(''+o.id+'')">WhatsApp</button></div>'+
    '</div>';
  }
  document.getElementById('dash-listos').innerHTML=h2||'<div class="empty">Ninguno</div>';

  var h3='';
  for(var i=0;i<vens.length;i++){
    if(vens[i].fecha===h){
      var v=vens[i];
      var g=v.venta-v.costo;
      h3+='<div class="item">'+
        '<div class="item-main"><div class="item-titulo">'+v.desc+'</div><div class="item-sub">'+v.cat+'</div></div>'+
        '<div class="item-side"><div class="item-monto">+'+din(g)+'</div><div style="font-size:11px;color:var(--muted);">'+din(v.venta)+'</div></div>'+
      '</div>';
    }
  }
  document.getElementById('dash-vens').innerHTML=h3||'<div class="empty">Sin ventas hoy</div>';
}

function rOrd(){
  alerta();
  var busca=document.getElementById('busca-ord').value.toLowerCase();
  var filtro=document.getElementById('flt-est').value;
  var cnts='';
  for(var i=0;i<ESTADOS.length;i++){
    var e=ESTADOS[i];
    var n=0;
    for(var j=0;j<ords.length;j++) if(ords[j].est===e) n++;
    var act=filtro===e;
    cnts+='<div class="stat'+(act?' stat-active':'')+'" onclick="fltE(''+e+'')" style="cursor:pointer;'+(act?'border-left-color:var(--gold);background:var(--goldb);':'')+'">'+
      '<div class="stat-val" style="color:'+EC[e]+';font-size:20px;">'+n+'</div>'+
      '<div class="stat-lbl">'+e+'</div>'+
    '</div>';
  }
  document.getElementById('ord-stats').innerHTML=cnts;

  var html='';
  for(var i=0;i<ords.length;i++){
    var o=ords[i];
    var mb=!busca||o.cli.toLowerCase().indexOf(busca)>=0||o.eq.toLowerCase().indexOf(busca)>=0||o.id.toLowerCase().indexOf(busca)>=0;
    if(!mb||( filtro&&o.est!==filtro)) continue;
    html+='<div class="item" onclick="abrirDet(''+o.id+'')">'+
      '<div class="item-main">'+
        '<div class="item-id">'+o.id+' -- '+o.fecha+' '+o.hora+'</div>'+
        '<div class="item-titulo">'+o.cli+'</div>'+
        '<div class="item-sub">'+o.eq+' -- '+o.prob+'</div>'+
      '</div>'+
      '<div class="item-side">'+
        bdg(o.est)+
        (o.pagado?'<span class="badge b-pag">Pagado</span>':'')+
        (o.precio>0?'<div class="item-monto">'+din(o.precio)+'</div>':'')+
        '<button class="btn btn-muted btn-sm" onclick="event.stopPropagation();abrirTick(''+o.id+'')">Ticket</button>'+
      '</div>'+
    '</div>';
  }
  document.getElementById('lista-ords').innerHTML=html||'<div class="empty">No hay ordenes</div>';
}

function fltE(e){
  var s=document.getElementById('flt-est');
  s.value=s.value===e?'':e;
  rOrd();
}

function abrirNO(){
  var ids=['o-cli','o-tel','o-eq','o-serie','o-clave','o-prob','o-obs'];
  for(var i=0;i<ids.length;i++) document.getElementById(ids[i]).value='';
  document.getElementById('o-precio').value='';
  document.getElementById('o-sugs').innerHTML='';
  abrir('m-orden');
}

function sugCli(v){
  var box=document.getElementById('o-sugs');
  if(!v){box.innerHTML='';return;}
  var seen={},html='';
  for(var i=0;i<ords.length;i++){
    var o=ords[i];
    if(o.cli.toLowerCase().indexOf(v.toLowerCase())>=0&&!seen[o.cli]){
      seen[o.cli]=1;
      html+='<span class="sug" onclick="selCli(''+o.cli+'',''+o.tel+'')">'+o.cli+'</span>';
    }
  }
  box.innerHTML=html;
}

function selCli(n,t){
  document.getElementById('o-cli').value=n;
  document.getElementById('o-tel').value=t;
  document.getElementById('o-sugs').innerHTML='';
}

function guardarO(){
  var cli=document.getElementById('o-cli').value.trim();
  var eq=document.getElementById('o-eq').value.trim();
  var prob=document.getElementById('o-prob').value.trim();
  if(!cli||!eq||!prob){alert('Cliente, equipo y problema son obligatorios.');return;}
  var o={id:'OR-'+uid(),fecha:hoy(),hora:aho(),cli:cli,tel:document.getElementById('o-tel').value.trim(),eq:eq,serie:document.getElementById('o-serie').value.trim(),prob:prob,precio:Number(document.getElementById('o-precio').value)||0,clave:document.getElementById('o-clave').value.trim(),obs:document.getElementById('o-obs').value.trim(),est:'Ingresado',pagado:false,medio:''};
  ords.unshift(o);
  save();cerrar('m-orden');rOrd();rDash();
  abrirTick(o.id);
}

var ordAct=null;
function abrirDet(id){
  ordAct=null;
  for(var i=0;i<ords.length;i++) if(ords[i].id===id){ordAct=ords[i];break;}
  if(!ordAct) return;
  var o=ordAct;
  document.getElementById('det-tit').textContent='Orden '+o.id;
  document.getElementById('det-info').innerHTML='<b>Cliente:</b> '+o.cli+' -- '+o.tel+'<br><b>Equipo:</b> '+o.eq+(o.serie?' | '+o.serie:'')+'<br><b>Problema:</b> '+o.prob+'<br><b>Ingresado:</b> '+o.fecha+' '+o.hora;
  rStep(o.est);
  document.getElementById('det-precio').value=o.precio||'';
  document.getElementById('det-medio').value=o.medio||'';
  document.getElementById('det-pago').checked=!!o.pagado;
  document.getElementById('det-clave').value=o.clave||'';
  document.getElementById('det-obs').value=o.obs||'';
  document.getElementById('det-alert').style.display=o.est==='Listo'?'block':'none';
  abrir('m-det');
}

function rStep(cur){
  var idx=ESTADOS.indexOf(cur);
  var html='<div class="stepper">';
  for(var i=0;i<ESTADOS.length;i++){
    var e=ESTADOS[i];
    var done=i<idx,actv=i===idx;
    var cls=done?'done':actv?'cur':'';
    html+='<div class="step" onclick="cambE(''+e+'')">';
    html+='<div class="step-wrap">';
    if(i>0) html+='<div class="step-line'+(done||actv?' done':'')+'"></div>';
    html+='<div class="step-dot '+cls+'">'+(done?'&#10003;':(i+1))+'</div>';
    if(i<ESTADOS.length-1) html+='<div class="step-line'+(done?' done':'')+'"></div>';
    html+='</div>';
    html+='<div class="step-txt '+cls+'">'+e+'</div>';
    html+='</div>';
  }
  html+='</div>';
  document.getElementById('det-step').innerHTML=html;
}

function cambE(e){
  if(!ordAct) return;
  ordAct.est=e;
  rStep(e);
  document.getElementById('det-alert').style.display=e==='Listo'?'block':'none';
}

function guardarDet(){
  if(!ordAct) return;

var pvP='hoy', pcP='hoy';

function setPV(p,btn){
  pvP=p;
  var bs=document.querySelectorAll('#ptabs-v .ptab');
  for(var i=0;i<bs.length;i++) bs[i].classList.remove('active');
  btn.classList.add('active');
  rVen();
}

function setPC(p,btn){
  pcP=p;
  var bs=document.querySelectorAll('#ptabs-c .ptab');
  for(var i=0;i<bs.length;i++) bs[i].classList.remove('active');
  btn.classList.add('active');
  rCaja();
}

function filPer(lista,campo,per){
  var hoyStr=hoy();
  var now=new Date();
  var res=[];
  for(var i=0;i<lista.length;i++){
    var val=lista[i][campo];
    if(!val) continue;
    var p=val.split('/');
    if(p.length!==3) continue;
    var d=Number(p[0]),m=Number(p[1])-1,a=Number(p[2]);
    var f=new Date(a,m,d);
    if(per==='hoy'&&val===hoyStr) res.push(lista[i]);
    else if(per==='semana'){var lun=new Date(now);lun.setDate(now.getDate()-((now.getDay()+6)%7));lun.setHours(0,0,0,0);if(f>=lun) res.push(lista[i]);}
    else if(per==='mes'&&m===now.getMonth()&&a===now.getFullYear()) res.push(lista[i]);
    else if(per==='anio'&&a===now.getFullYear()) res.push(lista[i]);
  }
  return res;
}

function abrirNV(){
  document.getElementById('v-desc').value='';
  document.getElementById('v-costo').value='';
  document.getElementById('v-ven').value='';
  document.getElementById('v-g').textContent='$0';
  document.getElementById('v-m').textContent='0%';
  document.getElementById('v-cat').value='Producto';
  document.getElementById('v-medio').value='';
  abrir('m-venta');
}

function calcG(){
  var c=Number(document.getElementById('v-costo').value)||0;
  var v=Number(document.getElementById('v-ven').value)||0;
  var g=v-c;
  var m=v>0?Math.round((g/v)*100):0;
  document.getElementById('v-g').textContent=din(g);
  document.getElementById('v-g').style.color=g>=0?'var(--green)':'var(--red)';
  document.getElementById('v-m').textContent=m+'%';
}

function guardarV(){
  var desc=document.getElementById('v-desc').value.trim();
  if(!desc){alert('La descripcion es obligatoria.');return;}
  var costo=Number(document.getElementById('v-costo').value)||0;
  var venta=Number(document.getElementById('v-ven').value)||0;
  vens.unshift({id:'V-'+uid(),fecha:hoy(),hora:aho(),desc:desc,costo:costo,venta:venta,cat:document.getElementById('v-cat').value,medio:document.getElementById('v-medio').value});
  save();cerrar('m-venta');rVen();rDash();
}

function rVen(){
  var fil=filPer(vens,'fecha',pvP);
  var tv=0,tc=0;
  for(var i=0;i<fil.length;i++){tv+=fil[i].venta;tc+=fil[i].costo;}
  var tg=tv-tc;
  var mg=tv>0?Math.round((tg/tv)*100):0;
  document.getElementById('ven-stats').innerHTML=
    '<div class="stat green"><div class="stat-val" style="color:var(--green);">'+din(tv)+'</div><div class="stat-lbl">Ventas</div></div>'+
    '<div class="stat"><div class="stat-val" style="color:var(--muted);">'+din(tc)+'</div><div class="stat-lbl">Costo</div></div>'+
    '<div class="stat blue"><div class="stat-val" style="color:var(--blue);">'+din(tg)+'</div><div class="stat-lbl">Ganancia</div></div>'+
    '<div class="stat"><div class="stat-val" style="color:var(--gold);">'+mg+'%</div><div class="stat-lbl">Margen</div></div>';
  var html='';
  for(var i=0;i<fil.length;i++){
    var v=fil[i];
    var g=v.venta-v.costo;
    html+='<div class="item">'+
      '<div class="item-main"><div class="item-titulo">'+v.desc+'</div><div class="item-sub">'+v.cat+' -- '+v.fecha+(v.medio?' -- '+v.medio:'')+'</div></div>'+
      '<div class="item-side"><div class="item-monto">+'+din(g)+'</div><div style="font-size:11px;color:var(--muted);">'+din(v.venta)+'</div></div>'+
    '</div>';
  }
  document.getElementById('lista-vens').innerHTML=html||'<div class="empty">Sin ventas en este periodo</div>';
}

function rCaja(){
  var filV=filPer(vens,'fecha',pcP);
  var filO=filPer(ords,'fecha',pcP);
  var pOrd=[];
  for(var i=0;i<filO.length;i++) if(filO[i].pagado) pOrd.push(filO[i]);
  var tv=0,tc=0;
  for(var i=0;i<filV.length;i++){tv+=filV[i].venta;tc+=filV[i].costo;}
  var gV=tv-tc;
  var cR=0;
  for(var i=0;i<pOrd.length;i++) cR+=pOrd[i].precio;
  var gT=gV+cR;
  var ef=0,tr=0;
  for(var i=0;i<filV.length;i++){
    if(filV[i].medio==='Efectivo') ef+=filV[i].venta;
    if(filV[i].medio==='Transferencia') tr+=filV[i].venta;
  }
  for(var i=0;i<pOrd.length;i++){
    if(pOrd[i].medio==='Efectivo') ef+=pOrd[i].precio;
    if(pOrd[i].medio==='Transferencia') tr+=pOrd[i].precio;
  }
  var labs={hoy:'hoy',semana:'esta semana',mes:'este mes',anio:'este anio'};
  var lab=labs[pcP]||pcP;
  var detR='';
  for(var i=0;i<pOrd.length;i++){
    detR+='<div class="caja-row"><span>'+pOrd[i].cli+' -- '+pOrd[i].eq+'</span><span style="font-weight:600;">'+din(pOrd[i].precio)+'</span></div>';
  }
  document.getElementById('caja-content').innerHTML=
    '<div class="stats" style="margin-bottom:14px;">'+
      '<div class="stat green"><div class="stat-val" style="color:var(--green);">'+din(gT)+'</div><div class="stat-lbl">Ganancia '+lab+'</div></div>'+
      '<div class="stat blue"><div class="stat-val" style="color:var(--blue);">'+din(tv+cR)+'</div><div class="stat-lbl">Total cobrado</div></div>'+
      '<div class="stat"><div class="stat-val" style="color:var(--text2);">'+din(ef)+'</div><div class="stat-lbl">Efectivo</div></div>'+
      '<div class="stat"><div class="stat-val" style="color:var(--text2);">'+din(tr)+'</div><div class="stat-lbl">Transferencia</div></div>'+
    '</div>'+
    '<div class="grid-2col">'+
      '<div class="card">'+
        '<div class="card-hdr"><span class="card-title">Ventas '+lab+'</span></div>'+
        '<div style="padding:14px 16px;">'+
          '<div class="caja-row"><span>Total vendido</span><span style="font-weight:700;">'+din(tv)+'</span></div>'+
          '<div class="caja-row"><span>Costo productos</span><span style="font-weight:700;color:var(--red);">-'+din(tc)+'</span></div>'+
          '<div class="caja-row total"><span>Ganancia ventas</span><span style="color:var(--green);">'+din(gV)+'</span></div>'+
        '</div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="card-hdr"><span class="card-title">Reparaciones cobradas '+lab+'</span></div>'+
        '<div style="padding:14px 16px;">'+
          (detR||'<div style="font-size:12px;color:var(--muted);">Sin reparaciones cobradas</div>')+
          (detR?'<div class="caja-row total"><span>Total</span><span style="color:var(--green);">'+din(cR)+'</span></div>':'')+
        '</div>'+
      '</div>'+
    '</div>';
}

function exportar(){
  var d={ordenes:ords,ventas:vens,fecha:new Date().toLocaleString('es-AR')};
  var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var u=URL.createObjectURL(b);
  var a=document.createElement('a');
  var fn=hoy().split('/').join('-');
  a.href=u;a.download='FlorentinoPc_backup_'+fn+'.json';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(u);
}

function importar(input){
  var f=input.files[0];if(!f) return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      if(d.ordenes) ords=d.ordenes;
      if(d.ventas) vens=d.ventas;
      save();rDash();
      alert('Backup restaurado correctamente!');
    }catch(err){alert('Error al leer el archivo.');}
    input.value='';
  };
  r.readAsText(f);
}

function abrir(id){document.getElementById(id).classList.add('open');}
function cerrar(id){document.getElementById(id).classList.remove('open');}

for(var i=0;i<mods.length;i++){

    m.addEventListener('click',function(e){

}
